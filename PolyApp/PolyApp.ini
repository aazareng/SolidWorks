; PolyApp for SOLIDWORKS - locations and options.
;
; Layering (later wins):  defaults compiled in
;                         PolyApp.ini next to the add-in DLL / polyapp.exe   (this file, shipped)
;                         %APPDATA%\PolyApp\PolyApp.ini                      (per-user overrides: only the keys you change)
;                         the file named by the POLYAPP_INI environment variable
; %Name% expands to another key in the same section, then [Paths], then an environment variable.
; `polyapp ini` prints the resolved values and which file each one came from.

[Paths]
VaultRoot=C:\_PolyVault
SharedDocs=%VaultRoot%\SOLIDWORKS SHARED DOCUMENTS
Projects=%VaultRoot%\PROJECTS\
StandardParts=%VaultRoot%\STANDARD PARTS\GS\
Server=\\polyfleng01
CurrentProjects=%Server%\ENGINEERING\!PROJECTS\
CutsheetFolder=0000 Project Folder\1.0 - CUTSHEETS\
ShippingPO=\SHIPPING PURCHASE ORDER\
Manuals=%Server%\manuals\
EDrawings=%Server%\Production\Assembly Department\eDrawings_Assembly\
Laser=%Server%\production\!Sheet Metal\!LASER\
LaserLog=LASER-LOG.csv
CutsheetDb=%Server%\production\Polypack Production Schedule\MRP\!ASSETS\POLYAPP_MFG_BE.accdb
CutsheetTable=CUTSHEET_BOM

[Macro]
; The PolyAppPro macro the add-in drives until a command is ported to C#.
File=%SharedDocs%\Macros\PolyAppPro.swp
Module=mod_PolyAppEntry
Procedure=PA_Run

[Templates]
MaterialLibrary=%SharedDocs%\material libary\Polypack Material Library.sldmat
DesignLibrary=%SharedDocs%\Design Library\
SheetFormat=%SharedDocs%\drawing and part templates\A-PolyCerf.slddrt
ManualSheetFormat=%SharedDocs%\drawing and part templates\MANUAL.slddrt
KeywaySheetFormat=%SharedDocs%\drawing and part templates\5mmKW.slddrt
RevTable=%SharedDocs%\Tables\REV.sldrevtbt
Assembly=%SharedDocs%\drawing and part templates\PolyCerf.asmdot
Drawing=%SharedDocs%\drawing and part templates\A-PolyCerf.DRWDOT
ManualDrawing=%SharedDocs%\drawing and part templates\DWG\MANUAL.drwdot
BomCutsheet=%SharedDocs%\BOM templates\CUTSHEET.sldbomtbt
BomManual=%SharedDocs%\BOM templates\MANUAL.sldbomtbt
BomSalesOrder=%SharedDocs%\BOM templates\SALES ORDER BOM TEMPLATE.sldbomtbt
GaugeTable=%SharedDocs%\sheetmetal tables\gauge table\POLYPACK GAUGE TABLE (K-FACTOR).xls

[PDM]
; auto = log in if the PDM client is installed and the vault view exists; yes = required; no = never
Enabled=auto
Vault=_PolyVault
VaultEU=_PolyVaultEU

[Api]
Host=192.168.1.184
Port=8000

[Email]
; Real addresses go in your per-user file (%APPDATA%\PolyApp\PolyApp.ini), not in this shipped copy: the repo is public.
ShippingOrderTo=SHIPPING.ENG
HotsheetTo=Manufacturing
PorTemplate=%Server%\ENGINEERING\Documents\!Templates\POR.oft
ShippingOrderTemplate=%Server%\ENGINEERING\Documents\!Templates\SHIPPING_ORDER.oft
ReviewTemplate=%Server%\ENGINEERING\Documents\!Templates\REVIEW.oft

[Options]
Admin=AAZAR
MaxSheetMetalLength=3030
SheetMetalMaterial=304S.S. W/PAPER
DisplayState=STATE_TEST
; Power Select walks the whole tree (yes) or the top level only (no); the Tree button on the tab toggles it for the session
SelectTree=no

[Intercept]
; SOLIDWORKS command id of "Make Assembly from Part/Assembly". 0 = off. Find it with [Debug] LogCommands=yes
; (every command you click is written to the log with its id), then set it here: the PolyApp "Make" menu
; pops up in its place, with plain Make Assembly as the last item.
MakeAssembly=0

[Debug]
LogCommands=no

[MacroOptions]
; Override the frm_Main control a command sets before Run, for a macro whose control names differ:
;   <CommandId>=opt_Control[,opt_SecondControl]      e.g.  Branch=opt_Branch_MDL
; `polyapp commands` lists every command id with its current mapping.
